<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智驾影音 - Smart Drive Video</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#3B82F6',
                            600: '#2563EB',
                        },
                        slate: {
                            50: '#F8FAFC',
                            400: '#94A3B8',
                            500: '#64748B',
                            600: '#475569',
                            700: '#334155',
                            800: '#1E293B',
                            900: '#0F172A',
                        }
                    },
                    fontFamily: {
                        sans: ['HarmonyOS Sans', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0F172A;
            color: #F8FAFC;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="fixed top-0 w-full z-50 bg-slate-900/95 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-md mx-auto px-4 h-14 flex items-center justify-between">
            <h1 class="text-lg font-bold tracking-tight">智驾影音</h1>
            <button class="p-2 rounded-full hover:bg-slate-800 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 max-w-md mx-auto w-full px-4 pt-20 pb-24">
        
        <!-- Header Section -->
        <div class="mb-6 flex items-end justify-between">
            <div>
                <h2 class="text-2xl font-bold">行程库</h2>
                <p class="text-slate-400 text-sm mt-1">自动识别相册中的行车记录</p>
            </div>
            <span class="text-xs bg-brand-900/30 text-brand-400 px-2 py-1 rounded border border-brand-500/20">已同步 3 条</span>
        </div>

        <!-- Trip Library List -->
        <div class="space-y-4">
            
            <!-- Trip Card 1 -->
            <a href="editor.html" class="block bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-sm active:scale-[0.98] transition-transform hover:border-brand-500/50 group relative overflow-hidden">
                <!-- Highlight Glow -->
                <div class="absolute top-0 left-0 w-1 h-full bg-brand-500 rounded-l-xl"></div>
                
                <div class="flex justify-between items-start mb-3 pl-2">
                    <div class="flex items-center space-x-3">
                        <div class="h-12 w-12 rounded-lg bg-slate-900 flex items-center justify-center text-brand-500 relative overflow-hidden">
                             <!-- Thumbnail Placeholder -->
                             <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 z-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        </div>
                        <div>
                            <h4 class="font-bold text-slate-50 text-base">3月6日 夜间行车</h4>
                            <div class="flex items-center text-slate-400 text-xs mt-1">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                                <span>22:20 - 23:05</span>
                                <span class="mx-1.5 text-slate-600">|</span>
                                <span>45分钟</span>
                            </div>
                        </div>
                    </div>
                    <div class="bg-slate-700/50 px-2 py-1 rounded text-xs text-slate-300 font-mono border border-slate-600/30">3.2 GB</div>
                </div>
                
                <div class="flex items-center justify-between pl-2 mt-3">
                    <div class="flex space-x-2">
                        <span class="px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-500 text-[10px] font-medium border border-emerald-500/20 flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 mr-1" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                            </svg>
                            6视角全
                        </span>
                        <span class="px-2 py-0.5 rounded bg-slate-700/50 text-slate-400 text-[10px] border border-slate-600/30">问界 M9</span>
                    </div>
                    <span class="text-brand-500 text-xs font-medium group-hover:translate-x-1 transition-transform flex items-center">
                        去剪辑
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 ml-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                    </span>
                </div>
            </a>

            <!-- Trip Card 2 -->
            <div class="block bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-sm active:scale-[0.98] transition-transform hover:border-slate-600 pl-5">
                <div class="flex justify-between items-start mb-3">
                    <div class="flex items-center space-x-3">
                        <div class="h-12 w-12 rounded-lg bg-slate-900 flex items-center justify-center text-slate-600 relative overflow-hidden">
                             <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        </div>
                        <div>
                            <h4 class="font-bold text-slate-50 text-base">3月6日 上班通勤</h4>
                            <div class="flex items-center text-slate-400 text-xs mt-1">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                                <span>08:30 - 09:15</span>
                                <span class="mx-1.5 text-slate-600">|</span>
                                <span>45分钟</span>
                            </div>
                        </div>
                    </div>
                    <div class="bg-slate-700/50 px-2 py-1 rounded text-xs text-slate-300 font-mono border border-slate-600/30">2.8 GB</div>
                </div>
                
                <div class="flex items-center space-x-2 mt-3">
                    <span class="px-2 py-0.5 rounded bg-amber-500/10 text-amber-500 text-[10px] font-medium border border-amber-500/20 flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                        </svg>
                        缺左后视
                    </span>
                    <span class="px-2 py-0.5 rounded bg-slate-700/50 text-slate-400 text-[10px] border border-slate-600/30">智界 S7</span>
                </div>
            </div>

            <!-- Trip Card 3 -->
            <div class="block bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-sm opacity-60 pl-5">
                <div class="flex justify-between items-start mb-3">
                    <div class="flex items-center space-x-3">
                        <div class="h-12 w-12 rounded-lg bg-slate-900 flex items-center justify-center text-slate-600">
                             <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        </div>
                        <div>
                            <h4 class="font-bold text-slate-50 text-base">3月5日 短途</h4>
                            <div class="flex items-center text-slate-400 text-xs mt-1">
                                <span>18:00 - 18:10</span>
                                <span class="mx-1.5 text-slate-600">|</span>
                                <span>10分钟</span>
                            </div>
                        </div>
                    </div>
                    <div class="bg-slate-700/50 px-2 py-1 rounded text-xs text-slate-300 font-mono border border-slate-600/30">0.5 GB</div>
                </div>
            </div>
            
            <!-- Empty State Hint (Hidden by default, shown for concept) -->
            <!-- 
            <div class="flex flex-col items-center justify-center py-12 text-center">
                <div class="bg-slate-800/50 p-4 rounded-full mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                    </svg>
                </div>
                <h3 class="text-slate-300 font-medium mb-1">暂无行程记录</h3>
                <p class="text-slate-500 text-xs max-w-[200px]">请通过 Huawei Share 将行车记录仪视频分享至手机相册</p>
            </div> 
            -->

        </div>
    </main>

    <!-- Tab Bar -->
    <div class="fixed bottom-0 w-full bg-slate-900/95 backdrop-blur-lg border-t border-slate-800">
        <div class="max-w-md mx-auto px-6 h-16 flex items-center justify-between">
            <button class="flex flex-col items-center space-y-1 text-brand-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                </svg>
                <span class="text-[10px] font-medium">行程库</span>
            </button>
            <button class="flex flex-col items-center space-y-1 text-slate-500 hover:text-slate-300 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
                <span class="text-[10px] font-medium">创作</span>
            </button>
            <button class="flex flex-col items-center space-y-1 text-slate-500 hover:text-slate-300 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
                <span class="text-[10px] font-medium">我的</span>
            </button>
        </div>
    </div>

</body>
</html>
