<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Smart Drive Video V2 - Export</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#1e293b',
                            950: '#020617',
                        },
                        orange: {
                            500: '#f97316',
                            600: '#ea580c',
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    spacing: {
                        'safe-top': 'env(safe-area-inset-top)',
                        'safe-bottom': 'env(safe-area-inset-bottom)',
                        'safe-left': 'env(safe-area-inset-left)',
                        'safe-right': 'env(safe-area-inset-right)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-50 font-sans antialiased h-screen flex flex-col items-center justify-center p-6 pb-safe-bottom">

    <!-- Card Container -->
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-8 relative overflow-hidden">
        
        <!-- Background Glow -->
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-32 bg-orange-500/20 blur-[100px] rounded-full"></div>

        <!-- Content: Processing State (Hidden by default, shown for demo) -->
        <div id="processing-state" class="text-center space-y-6">
            <div class="relative w-24 h-24 mx-auto flex items-center justify-center">
                <!-- Spinner Ring -->
                <svg class="animate-spin text-slate-800" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75 text-orange-500" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <!-- Icon -->
                <div class="absolute inset-0 flex items-center justify-center">
                    <svg class="text-orange-500" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
                </div>
            </div>

            <div>
                <h2 class="text-2xl font-bold text-white mb-2">Exporting Video...</h2>
                <p class="text-slate-400">Applying privacy mask and rendering PiP layout.</p>
            </div>

            <!-- Progress Bar -->
            <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
                <div class="bg-orange-500 h-2 rounded-full w-[65%] shadow-[0_0_10px_rgba(249,115,22,0.5)]"></div>
            </div>
            <p class="text-sm font-mono text-slate-500">Estimated remaining: 12s</p>

            <button onclick="toggleSuccess()" class="text-slate-500 active:text-white text-sm underline mt-4 p-2 touch-manipulation">Demo: Simulate Complete</button>
        </div>

        <!-- Content: Success State (Hidden initially) -->
        <div id="success-state" class="text-center space-y-6 hidden">
            <div class="w-24 h-24 mx-auto bg-green-500/10 rounded-full flex items-center justify-center border border-green-500/20 shadow-[0_0_30px_rgba(34,197,94,0.2)]">
                <svg class="text-green-500 w-12 h-12" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
            </div>

            <div>
                <h2 class="text-2xl font-bold text-white mb-2">Export Complete!</h2>
                <p class="text-slate-400">Video saved to Photos.</p>
            </div>

            <div class="space-y-3 pt-4">
                <button class="w-full py-3 bg-orange-600 active:bg-orange-500 text-white font-bold rounded-xl shadow-lg shadow-orange-900/20 transition-all active:scale-95 flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="2" y2="15"/></svg>
                    Share to WeChat
                </button>
                <a href="index.html" class="block w-full py-3 bg-slate-800 active:bg-slate-700 text-slate-300 font-medium rounded-xl transition-all border border-slate-700 active:scale-95 flex items-center justify-center">
                    Back to Library
                </a>
            </div>
        </div>

    </div>

    <script>
        function toggleSuccess() {
            document.getElementById('processing-state').classList.add('hidden');
            document.getElementById('success-state').classList.remove('hidden');
            // Add subtle animation to card
            document.querySelector('.max-w-md').classList.add('scale-[1.02]', 'transition-transform');
            setTimeout(() => {
                document.querySelector('.max-w-md').classList.remove('scale-[1.02]');
            }, 200);
        }
    </script>
</body>
</html>
