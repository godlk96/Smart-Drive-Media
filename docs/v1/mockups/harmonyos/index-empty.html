<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智驾影音 · 行程库空态</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "HarmonyOS Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0F172A; color: #F8FAFC; }
    .app { max-width: 440px; min-height: 100vh; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    h1 { margin: 0; font-size: 24px; }
    .sub { margin: 8px 0 0; color: #94A3B8; font-size: 13px; }
    .btn { border: 1px solid #334155; background: #1E293B; color: #93C5FD; border-radius: 999px; padding: 8px 14px; font-size: 12px; }
    .hint { color: #94A3B8; font-size: 13px; line-height: 1.6; margin: auto 0; text-align: center; padding: 0 20px; }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <h1>智驾影音</h1>
      <button class="btn">已授权</button>
    </div>
    <p class="sub">自动识别相册中的行车记录</p>
    <div class="hint">暂无行程记录<br>请通过 Huawei Share 分享记录仪视频到手机相册</div>
  </div>
</body>
</html>
