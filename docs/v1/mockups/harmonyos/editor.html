<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智驾影音 · 剪辑工作台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "HarmonyOS Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0F172A; color: #F8FAFC; }
    .app { max-width: 440px; height: 100vh; margin: 0 auto; display: flex; flex-direction: column; }
    .row { display: flex; align-items: center; }
    .header { padding: 12px; gap: 10px; }
    .btn { border: 0; border-radius: 999px; padding: 7px 12px; font-size: 12px; cursor: pointer; }
    .btn-dark { background: #1E293B; color: #F8FAFC; }
    .btn-blue { background: #2563EB; color: #fff; }
    .title { flex: 1; text-align: center; }
    .title h1 { margin: 0; font-size: 14px; }
    .title p { margin: 3px 0 0; font-size: 11px; color: #94A3B8; }
    .export { font-size: 12px; color: #60A5FA; padding: 0 12px 6px; }
    .preview { margin: 0 12px; border-radius: 10px; overflow: hidden; background: #111827; height: 36%; position: relative; }
    .preview-cam { position: absolute; right: 10px; top: 10px; font-size: 11px; color: #93C5FD; background: rgba(15,23,42,.8); border: 1px solid #1E40AF; border-radius: 999px; padding: 4px 8px; }
    .preview-bg { width: 100%; height: 100%; background: linear-gradient(170deg, #334155 0%, #0f172a 55%, #111827 100%); display: flex; align-items: center; justify-content: center; color: #CBD5E1; font-size: 14px; }
    .meta { padding: 8px 12px 0; color: #94A3B8; font-size: 11px; }
    .line { padding: 6px 12px 0; }
    .group { padding: 6px 12px 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .label { color: #CBD5E1; font-size: 12px; }
    .slider { width: calc(100% - 24px); margin: 8px 12px 0; }
    .tracks { flex: 1; overflow: auto; padding: 8px 12px 12px; display: grid; gap: 6px; }
    .track { display: flex; align-items: center; justify-content: space-between; border-radius: 8px; background: #1E293B; padding: 10px; border: 1px solid transparent; cursor: pointer; }
    .track.active { border-color: #2563EB; }
    .track .cam { font-size: 12px; }
    .track .seg { font-size: 11px; color: #94A3B8; }
    .track .seg.warn { color: #F59E0B; }
    .footer { font-size: 12px; color: #3B82F6; padding: 0 12px 12px; }
    a { color: inherit; text-decoration: none; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header row">
      <a class="btn btn-dark" href="index.html">返回</a>
      <div class="title">
        <h1 id="tripTitle">剪辑工作台</h1>
        <p id="tripRange">22:20 - 23:05</p>
      </div>
      <button id="exportBtn" class="btn btn-blue">导出</button>
    </div>
    <div class="export">导出状态：<span id="exportStatus">待导出</span></div>

    <div class="preview">
      <div id="previewCam" class="preview-cam">当前视角：前摄</div>
      <div class="preview-bg">预览区（Mock）</div>
    </div>

    <div id="clipMeta" class="meta">当前片段 1/6</div>
    <div class="line row" style="gap:8px;">
      <button id="prevBtn" class="btn btn-dark">上一个</button>
      <button id="nextBtn" class="btn btn-dark">下一个</button>
      <button id="screenBtn" class="btn btn-dark" style="margin-left:auto;">全屏</button>
    </div>

    <div class="group">
      <label class="label"><input id="speed" type="checkbox" checked> 车速</label>
      <label class="label"><input id="gps" type="checkbox" checked> GPS</label>
      <label class="label"><input id="vin" type="checkbox" checked> VIN码</label>
    </div>

    <div id="playheadText" class="meta">00:00:00 / 00:45:00</div>
    <input id="slider" class="slider" type="range" min="0" max="2700" value="0">

    <div id="tracks" class="tracks"></div>
    <div id="footerStatus" class="footer">待导出</div>
  </div>

  <script>
    const params = new URLSearchParams(location.search)
    const title = params.get('title') || '剪辑工作台'
    const timeRange = params.get('timeRange') || '22:20 - 23:05'
    const trackData = [
      { cameraPosition: '前摄', segmentCount: 6, degraded: false },
      { cameraPosition: '后摄', segmentCount: 6, degraded: false },
      { cameraPosition: '左侧', segmentCount: 5, degraded: true },
      { cameraPosition: '右侧', segmentCount: 6, degraded: false },
      { cameraPosition: '左前', segmentCount: 6, degraded: false },
      { cameraPosition: '右前', segmentCount: 6, degraded: false }
    ]
    let activeCamera = '前摄'
    let currentIndex = 1
    let totalClip = 6
    let fullScreen = false
    let exportStep = 0
    const exportText = ['待导出', '正在准备任务...', '正在无损拼接...', '正在写入文件...', '导出完成：/mock/output.mp4']

    const tripTitle = document.getElementById('tripTitle')
    const tripRange = document.getElementById('tripRange')
    const previewCam = document.getElementById('previewCam')
    const clipMeta = document.getElementById('clipMeta')
    const tracks = document.getElementById('tracks')
    const playheadText = document.getElementById('playheadText')
    const slider = document.getElementById('slider')
    const exportStatus = document.getElementById('exportStatus')
    const footerStatus = document.getElementById('footerStatus')
    const prevBtn = document.getElementById('prevBtn')
    const nextBtn = document.getElementById('nextBtn')
    const screenBtn = document.getElementById('screenBtn')

    tripTitle.textContent = title
    tripRange.textContent = timeRange

    function secToClock(second) {
      const s = Math.max(0, Math.floor(second))
      const h = String(Math.floor(s / 3600)).padStart(2, '0')
      const m = String(Math.floor((s % 3600) / 60)).padStart(2, '0')
      const sec = String(s % 60).padStart(2, '0')
      return `${h}:${m}:${sec}`
    }

    function updateClipState() {
      clipMeta.textContent = `当前片段 ${currentIndex}/${totalClip}`
      prevBtn.disabled = currentIndex <= 1
      nextBtn.disabled = currentIndex >= totalClip
      prevBtn.style.opacity = prevBtn.disabled ? '.5' : '1'
      nextBtn.style.opacity = nextBtn.disabled ? '.5' : '1'
    }

    function updatePlayhead() {
      playheadText.textContent = `${secToClock(slider.value)} / 00:45:00`
    }

    function renderTracks() {
      tracks.innerHTML = ''
      trackData.forEach((item) => {
        const node = document.createElement('div')
        node.className = `track ${item.cameraPosition === activeCamera ? 'active' : ''}`
        node.innerHTML = `
          <span class="cam">${item.cameraPosition}</span>
          <span class="seg ${item.degraded ? 'warn' : ''}">片段 ${item.segmentCount}</span>
        `
        node.addEventListener('click', () => {
          activeCamera = item.cameraPosition
          previewCam.textContent = `当前视角：${activeCamera}`
          renderTracks()
        })
        tracks.appendChild(node)
      })
    }

    document.getElementById('exportBtn').addEventListener('click', () => {
      exportStep = Math.min(exportStep + 1, exportText.length - 1)
      exportStatus.textContent = exportText[exportStep]
      footerStatus.textContent = exportText[exportStep]
    })
    prevBtn.addEventListener('click', () => {
      currentIndex = Math.max(1, currentIndex - 1)
      updateClipState()
    })
    nextBtn.addEventListener('click', () => {
      currentIndex = Math.min(totalClip, currentIndex + 1)
      updateClipState()
    })
    screenBtn.addEventListener('click', () => {
      fullScreen = !fullScreen
      document.querySelector('.preview').style.height = fullScreen ? '58%' : '36%'
      screenBtn.textContent = fullScreen ? '退出全屏' : '全屏'
    })
    slider.addEventListener('input', updatePlayhead)

    updateClipState()
    updatePlayhead()
    renderTracks()
  </script>
</body>
</html>
