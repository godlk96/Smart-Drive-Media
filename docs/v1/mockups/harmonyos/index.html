<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智驾影音 · 行程库</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "HarmonyOS Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0F172A; color: #F8FAFC; }
    .app { max-width: 440px; min-height: 100vh; margin: 0 auto; padding: 16px 16px 24px; }
    .row { display: flex; align-items: center; }
    .title { font-size: 24px; font-weight: 700; margin: 0; }
    .sub { margin: 8px 0 0; color: #94A3B8; font-size: 13px; }
    .btn { border: 0; border-radius: 999px; padding: 8px 14px; font-size: 12px; cursor: pointer; }
    .btn-primary { background: #2563EB; color: #fff; }
    .btn-muted { background: #1E293B; color: #93C5FD; border: 1px solid #334155; }
    .permission-tip { margin-top: 10px; color: #F59E0B; font-size: 12px; }
    .merge-bar { display: none; margin-top: 14px; padding: 10px 12px; border-radius: 12px; background: #0B1220; border: 1px solid #1E3A8A; }
    .list { margin-top: 14px; display: grid; gap: 12px; }
    .card { background: #1E293B; border-radius: 12px; padding: 14px; cursor: pointer; border: 1px solid transparent; }
    .card:hover { border-color: #334155; }
    .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .card-title { margin: 0; font-size: 18px; font-weight: 600; }
    .card-sub { margin: 8px 0 0; color: #94A3B8; font-size: 12px; }
    .duration { color: #94A3B8; font-size: 11px; white-space: nowrap; }
    .card-foot { margin-top: 12px; display: flex; align-items: center; gap: 8px; color: #93C5FD; font-size: 11px; }
    .go { margin-left: auto; color: #3B82F6; font-size: 12px; }
    .empty { margin-top: 70px; text-align: center; color: #94A3B8; font-size: 13px; display: none; }
    a { color: inherit; text-decoration: none; }
  </style>
</head>
<body>
  <div class="app">
    <div class="row" style="justify-content: space-between; gap: 12px;">
      <h1 class="title">智驾影音</h1>
      <button id="permissionBtn" class="btn btn-primary">授权读取</button>
    </div>
    <p class="sub">自动识别相册中的行车记录</p>
    <div id="permissionTip" class="permission-tip">请先完成权限授权，才能读取相册中的行程视频</div>

    <div id="mergeBar" class="merge-bar row" style="justify-content: space-between;">
      <span id="selectedText" style="font-size:12px;color:#93C5FD;">已选 0 组</span>
      <a id="mergeLink" class="btn btn-muted" href="editor.html?tripId=merged-demo&title=合并行程&timeRange=03-06%2008:00-23:05">合并进入剪辑</a>
    </div>

    <div id="tripList" class="list"></div>
    <div id="emptyState" class="empty">暂无行程，请通过 Huawei Share 分享记录仪视频到相册</div>
  </div>

  <script>
    const trips = [
      { id: 'trip-0306-night', title: '3月6日 夜间行车', subtitle: '22:20 - 23:05 · 6视角', durationText: '45分钟' },
      { id: 'trip-0306-commute', title: '3月6日 上班通勤', subtitle: '08:30 - 09:15 · 5视角', durationText: '45分钟' },
      { id: 'trip-0305-short', title: '3月5日 短途', subtitle: '18:00 - 18:10 · 3视角', durationText: '10分钟' }
    ]
    let permissionGranted = false
    let selectedIds = []
    const permissionBtn = document.getElementById('permissionBtn')
    const permissionTip = document.getElementById('permissionTip')
    const tripList = document.getElementById('tripList')
    const emptyState = document.getElementById('emptyState')
    const mergeBar = document.getElementById('mergeBar')
    const selectedText = document.getElementById('selectedText')
    const mergeLink = document.getElementById('mergeLink')

    function render() {
      permissionBtn.textContent = permissionGranted ? '已授权' : '授权读取'
      permissionBtn.className = `btn ${permissionGranted ? 'btn-muted' : 'btn-primary'}`
      permissionTip.style.display = permissionGranted ? 'none' : 'block'
      tripList.innerHTML = ''
      if (!permissionGranted) {
        emptyState.style.display = 'block'
        mergeBar.style.display = 'none'
        return
      }
      emptyState.style.display = trips.length === 0 ? 'block' : 'none'
      mergeBar.style.display = selectedIds.length > 0 ? 'flex' : 'none'
      selectedText.textContent = `已选 ${selectedIds.length} 组`
      mergeLink.href = `editor.html?tripId=merged-${selectedIds.join('+')}&title=合并行程&timeRange=已合并%20${selectedIds.length}%20组`
      trips.forEach((item) => {
        const checked = selectedIds.includes(item.id) ? 'checked' : ''
        const card = document.createElement('a')
        card.className = 'card'
        card.href = `editor.html?tripId=${encodeURIComponent(item.id)}&title=${encodeURIComponent(item.title)}&timeRange=${encodeURIComponent(item.subtitle.split('·')[0].trim())}`
        card.innerHTML = `
          <div class="card-head">
            <div>
              <h3 class="card-title">${item.title}</h3>
              <p class="card-sub">${item.subtitle}</p>
            </div>
            <span class="duration">${item.durationText}</span>
          </div>
          <div class="card-foot">
            <input data-id="${item.id}" type="checkbox" ${checked}>
            <span>选中分组</span>
            <span class="go">去剪辑</span>
          </div>
        `
        tripList.appendChild(card)
      })
      Array.from(tripList.querySelectorAll('input[type=checkbox]')).forEach((el) => {
        el.addEventListener('click', (event) => {
          event.stopPropagation()
        })
        el.addEventListener('change', (event) => {
          const id = event.target.getAttribute('data-id')
          if (event.target.checked) {
            selectedIds = [...selectedIds, id]
          } else {
            selectedIds = selectedIds.filter((value) => value !== id)
          }
          render()
        })
      })
    }

    permissionBtn.addEventListener('click', () => {
      permissionGranted = !permissionGranted
      if (!permissionGranted) {
        selectedIds = []
      }
      render()
    })

    render()
  </script>
</body>
</html>
