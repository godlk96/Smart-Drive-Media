<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>行车记录6视角剪辑</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'HarmonyOS Sans SC', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #181818;
            color: #FFFFFF;
            min-height: 100vh;
            padding-bottom: 100px;
        }

        .container {
            max-width: 414px;
            margin: 0 auto;
            padding: 0 16px;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0;
            position: sticky;
            top: 0;
            background-color: #181818;
            z-index: 100;
        }

        .navbar h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .nav-buttons {
            display: flex;
            gap: 8px;
        }

        .nav-btn {
            padding: 8px 16px;
            background-color: transparent;
            border: 1px solid #444444;
            border-radius: 8px;
            color: #FFFFFF;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: -apple-system, BlinkMacSystemFont, 'HarmonyOS Sans SC', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        .nav-btn:active {
            transform: scale(0.98);
        }

        .nav-btn.active {
            background-color: #FF7A00;
            border-color: #FF7A00;
        }

        .nav-btn.primary {
            background-color: #FF7A00;
            border-color: #FF7A00;
            color: #FFFFFF;
        }

        .nav-btn.hidden {
            display: none;
        }

        .video-group-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .video-group-card {
            background-color: #282828;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            border: 2px solid transparent;
        }

        .video-group-card:active {
            transform: scale(0.98);
        }

        .video-group-card.selected {
            border-color: #FF7A00;
        }

        .card-cover {
            position: relative;
            aspect-ratio: 16 / 9;
            background-color: #333333;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 1px;
            padding: 1px;
        }

        .view-thumbnail {
            background-color: #444444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            color: #999999;
            border-radius: 2px;
        }

        .view-thumbnail.missing {
            background-color: #333333;
            color: #666666;
        }

        .completeness-badge {
            position: absolute;
            top: 4px;
            left: 4px;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: 500;
        }

        .completeness-badge.complete {
            background-color: #0A59F7;
            color: #FFFFFF;
        }

        .completeness-badge.incomplete {
            background-color: #FF7A00;
            color: #FFFFFF;
        }

        .checkmark {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 20px;
            height: 20px;
            background-color: #FF7A00;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .video-group-card.selected .checkmark {
            display: flex;
        }

        .card-content {
            padding: 8px;
        }

        .card-time {
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 2px;
        }

        .card-views {
            font-size: 10px;
            color: #999999;
        }



        .toast {
            position: fixed;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: rgba(0, 0, 0, 0.9);
            color: #FFFFFF;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <h1>行车记录6视角剪辑</h1>
            <div class="nav-buttons">
                <button class="nav-btn primary hidden" id="mergeBtn" onclick="mergeEdit()">合并剪辑</button>
                <button class="nav-btn" id="selectBtn" onclick="toggleSelectMode()">多选</button>
            </div>
        </nav>

        <div class="video-group-list" id="videoGroupList">
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const videoGroups = [
            {
                id: 1,
                time: '03-15 14:35-14:36',
                views: ['前', '左前', '右前', '左后', '右后', '后'],
                isComplete: true,
                duration: 60
            },
            {
                id: 2,
                time: '03-15 14:36-14:37',
                views: ['前', '左前', '右前', '左后', '右后', '后'],
                isComplete: true,
                duration: 60
            },
            {
                id: 3,
                time: '03-15 14:37-14:38',
                views: ['前', '左前', '右前', '左后', '右后'],
                isComplete: false,
                duration: 60
            },
            {
                id: 4,
                time: '03-15 14:38-14:39',
                views: ['前', '左后', '右后', '后'],
                isComplete: false,
                duration: 60
            }
        ];

        let selectedGroups = new Set();
        let isSelectMode = false;

        function renderVideoGroups() {
            const list = document.getElementById('videoGroupList');
            list.innerHTML = videoGroups.map(group => {
                const allViews = ['前', '左前', '右前', '左后', '右后', '后'];
                const thumbnails = allViews.map(view => {
                    const hasView = group.views.includes(view);
                    return `<div class="view-thumbnail ${hasView ? '' : 'missing'}">${hasView ? view : '无'}</div>`;
                }).join('');

                return `
                    <div class="video-group-card ${selectedGroups.has(group.id) ? 'selected' : ''}" 
                         data-id="${group.id}"
                         onclick="handleCardClick(${group.id})">
                        <div class="card-cover">
                            ${thumbnails}
                            <span class="completeness-badge ${group.isComplete ? 'complete' : 'incomplete'}">
                                ${group.isComplete ? '完整' : '不完整'}
                            </span>
                            <span class="checkmark">✓</span>
                        </div>
                        <div class="card-content">
                            <div class="card-time">${group.time}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function handleCardClick(groupId) {
            if (isSelectMode) {
                toggleSelection(groupId);
            } else {
                singleEdit(groupId);
            }
        }

        function toggleSelection(groupId) {
            if (selectedGroups.has(groupId)) {
                selectedGroups.delete(groupId);
            } else {
                selectedGroups.add(groupId);
            }
            updateMergeBtn();
            renderVideoGroups();
        }

        function toggleSelectMode() {
            isSelectMode = !isSelectMode;
            const btn = document.getElementById('selectBtn');
            if (isSelectMode) {
                btn.classList.add('active');
                btn.textContent = '取消';
            } else {
                btn.classList.remove('active');
                btn.textContent = '多选';
                selectedGroups.clear();
                updateMergeBtn();
            }
            renderVideoGroups();
        }

        function updateMergeBtn() {
            const mergeBtn = document.getElementById('mergeBtn');
            if (selectedGroups.size >= 2) {
                mergeBtn.classList.remove('hidden');
            } else {
                mergeBtn.classList.add('hidden');
            }
        }

        function singleEdit(groupId) {
            window.location.href = `edit.html?type=single&groupId=${groupId}`;
        }

        function mergeEdit() {
            if (selectedGroups.size === 0) return;
            const ids = Array.from(selectedGroups).join(',');
            window.location.href = `edit.html?type=merge&groupIds=${ids}`;
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        renderVideoGroups();
    </script>
</body>
</html>
