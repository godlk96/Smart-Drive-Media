<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>导出进度</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'HarmonyOS Sans SC', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #181818;
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 414px;
            margin: 0 auto;
            padding: 0 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0;
            position: sticky;
            top: 0;
            background-color: #181818;
            z-index: 100;
        }

        .nav-btn {
            background: none;
            border: none;
            color: #666666;
            font-size: 16px;
            padding: 8px;
            cursor: not-allowed;
        }

        .nav-title {
            font-size: 18px;
            font-weight: 600;
        }

        .spacer {
            width: 60px;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px 0;
        }

        .status-text {
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 40px;
        }

        .progress-container {
            margin-bottom: 24px;
        }

        .progress-bar {
            height: 8px;
            background-color: #333333;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-fill {
            height: 100%;
            background-color: #0A59F7;
            border-radius: 4px;
            width: 0%;
            transition: width 0.5s ease;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #999999;
        }

        .template-info {
            background-color: #282828;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 40px;
        }

        .template-info-item {
            font-size: 14px;
            color: #999999;
            margin-bottom: 8px;
        }

        .template-info-item:last-child {
            margin-bottom: 0;
        }

        .template-info-item span {
            color: #FFFFFF;
        }

        .button-container {
            margin-bottom: 24px;
        }

        .btn {
            width: 100%;
            padding: 16px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: #0A59F7;
            color: #FFFFFF;
        }

        .btn-primary:active {
            background-color: #0849C7;
        }

        .btn-secondary {
            background-color: #333333;
            color: #FFFFFF;
        }

        .btn-secondary:active {
            background-color: #444444;
        }

        .btn-success {
            background-color: #FF7A00;
            color: #FFFFFF;
        }

        .btn-success:active {
            background-color: #E06A00;
        }

        .bottom-tip {
            text-align: center;
            font-size: 14px;
            color: #666666;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background-color: #282828;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 340px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
            text-align: center;
        }

        .modal-content {
            font-size: 14px;
            color: #999999;
            text-align: center;
            margin-bottom: 24px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
        }

        .modal-actions .btn {
            flex: 1;
            padding: 12px 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <button class="nav-btn">← 返回</button>
            <span class="nav-title" id="pageTitle">导出单组视频</span>
            <div class="spacer"></div>
        </nav>

        <div class="content">
            <div class="status-text" id="statusText">导出中...</div>

            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-info">
                    <span id="progressPercent">0%</span>
                    <span id="estimatedTime">预估剩余：60秒</span>
                </div>
            </div>

            <div class="template-info" id="templateInfo">
                <div class="template-info-item">模板：<span id="templateName">单视角</span></div>
                <div class="template-info-item">分辨率：<span id="resolution">1920×1080</span></div>
                <div class="template-info-item">内容：<span id="contentInfo">单组视频 | 裁剪后时长60秒</span></div>
            </div>

            <div class="button-container" id="buttonContainer">
                <button class="btn btn-secondary" onclick="showCancelModal()">取消导出</button>
            </div>

            <div class="bottom-tip">导出完成后将自动保存到本地相册</div>
        </div>
    </div>

    <div class="modal-overlay" id="cancelModal">
        <div class="modal">
            <div class="modal-title">确认取消导出？</div>
            <div class="modal-content">取消导出将丢失当前进度</div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeCancelModal()">继续导出</button>
                <button class="btn btn-primary" onclick="confirmCancel()">取消</button>
            </div>
        </div>
    </div>

    <script>
        let progress = 0;
        let isComplete = false;
        let progressInterval = null;

        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                type: params.get('type'),
                groupId: params.get('groupId'),
                groupIds: params.get('groupIds'),
                template: params.get('template'),
                templateName: params.get('templateName'),
                resolution: params.get('resolution'),
                speed: params.get('speed'),
                mosaicEnabled: params.get('mosaicEnabled'),
                clipSegments: params.get('clipSegments')
            };
        }

        function initPage() {
            const params = getUrlParams();
            
            if (params.type === 'merge') {
                document.getElementById('pageTitle').textContent = '导出合并视频';
                document.getElementById('contentInfo').textContent = '多组合并 | 裁剪后时长120秒';
            } else {
                document.getElementById('pageTitle').textContent = '导出单组视频';
                document.getElementById('contentInfo').textContent = '单组视频 | 裁剪后时长60秒';
            }

            if (params.templateName) {
                document.getElementById('templateName').textContent = decodeURIComponent(params.templateName);
            }

            if (params.resolution) {
                document.getElementById('resolution').textContent = decodeURIComponent(params.resolution);
            }

            startProgress();
        }

        function startProgress() {
            progressInterval = setInterval(() => {
                if (!isComplete) {
                    progress += 5;
                    if (progress > 100) {
                        progress = 100;
                        complete();
                    }
                    updateProgress();
                }
            }, 500);
        }

        function updateProgress() {
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressPercent').textContent = progress + '%';
            
            const remaining = Math.ceil((100 - progress) * 0.6);
            document.getElementById('estimatedTime').textContent = '预估剩余：' + remaining + '秒';
        }

        function complete() {
            isComplete = true;
            clearInterval(progressInterval);
            
            document.getElementById('statusText').textContent = '导出完成！';
            document.getElementById('estimatedTime').textContent = '';
            document.getElementById('buttonContainer').innerHTML = `
                <button class="btn btn-success" onclick="goToList()">返回列表</button>
            `;
        }



        function showCancelModal() {
            if (!isComplete) {
                document.getElementById('cancelModal').classList.add('active');
            }
        }

        function closeCancelModal() {
            document.getElementById('cancelModal').classList.remove('active');
        }

        function confirmCancel() {
            closeCancelModal();
            const params = getUrlParams();
            const urlParams = new URLSearchParams();
            if (params.type) urlParams.set('type', params.type);
            if (params.groupId) urlParams.set('groupId', params.groupId);
            if (params.groupIds) urlParams.set('groupIds', params.groupIds);
            if (params.template) urlParams.set('template', params.template);
            if (params.speed) urlParams.set('speed', params.speed);
            if (params.mosaicEnabled) urlParams.set('mosaicEnabled', params.mosaicEnabled);
            if (params.clipSegments) urlParams.set('clipSegments', params.clipSegments);
            window.location.href = `edit.html?${urlParams.toString()}`;
        }

        function goToList() {
            window.location.href = 'index.html';
        }

        initPage();
    </script>
</body>
</html>
